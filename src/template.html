<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outwolf | Tienda de equipo de trekking</title>
  </head>
  <body>
    <header>
      <div class="top-header">
        <div class="social-icons">
          <a href="#"
            ><img
              src="./assets/icons/facebook-svgrepo-com.svg"
              alt="facebook link"
          /></a>
          <a href="#"
            ><img
              src="./assets/icons/instagram-logo-facebook-2-svgrepo-com.svg"
              alt="instagram link"
          /></a>
          <a href="#"
            ><img
              src="./assets/icons/whatsapp-logo-variant-svgrepo-com.svg"
              alt="whatsapp link"
          /></a>
          <a href="#"
            ><img src="./assets/icons/github-svgrepo-com.svg" alt="github link"
          /></a>
        </div>
        <div class="announcements">
          <img
            src="./assets/icons/angle-left-svgrepo-com.svg"
            alt="left arrow"
          />
          <p>20% de descuento al usar el codigo: TREKKHONDURAS</p>
          <img
            src="./assets/icons/angle-right-svgrepo-com.svg"
            alt="right arrow"
          />
        </div>
        <div class="language-and-location"></div>
      </div>
      <div class="middle-header">
        <div class="logo">
          <a href="">
            <img src="./assets/images/logo.png" alt="Outwolf logo" />
          </a>
        </div>
        <div class="search-bar">
          <input
            type="text"
            name="search-field"
            id="search-field"
            aria-label="Search field"
            placeholder="Buscar"
          />
          <img src="./assets/icons/search-svgrepo-com.svg" alt="search icon" />
        </div>
        <div>
          <div class="favourites">
            <a href="#">
              <img src="./assets/icons/heart-svgrepo-com.svg" alt="favourite" />
            </a>
          </div>
          <div>
            <a href="#">
              <img
                src="./assets/icons/shopping-cart-svgrepo-com.svg"
                alt="shopping cart"
              />
            </a>
          </div>
          <div class="header-user-login">
            <a href="#">
              <img src="./assets/icons/user-svgrepo-com.svg" alt="user" />
            </a>
            <span><b>Log In</b></span>
          </div>
        </div>
      </div>
      <div class="bottom-header">
        <nav>
          <ul>
            <li><a href="">Inicio</a></li>
            <li>
              <a href=""
                >Productos
                <img src="./assets/icons/angle-down-svgrepo-com.svg" alt=""
              /></a>
            </li>
            <li>
              <a href=""
                >Categorias
                <img src="./assets/icons/angle-down-svgrepo-com.svg" alt=""
              /></a>
            </li>
            <li>
              <a href=""
                >Eventos
                <img src="./assets/icons/angle-down-svgrepo-com.svg" alt=""
              /></a>
            </li>
            <li>
              <a href=""
                >Blog
                <img src="./assets/icons/angle-down-svgrepo-com.svg" alt=""
              /></a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
